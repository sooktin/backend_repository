jwt:
  issuer: ${/sooktin/prod/jwt/issuer}
  access-expiration: ${/sooktin/prod/jwt/access-expiration}
  refresh-expiration: ${/sooktin/prod/jwt/refresh-expiration}
  secret-key: ${/sooktin/prod/jwt/secret-key}

server:
  error:
    include-binding-errors: always
    include-message: always
  address: 0.0.0.0
  port: 8080

cloud:
  aws:
    credentials:
      instance-profile: true  # EC2 IAM 역할 사용
    paramstore:
      enabled: true
      prefix: /sooktin/prod
      name: sooktin
      defaultContext: application
      profileSeparator: _
    region:
      static: ap-northeast-2
    stack:
      auto: false
    s3:
      bucket: ${/sooktin/prod/aws/s3-bucket}

spring:
  application:
    name: sooktin
  config:
    import: aws-parameterstore:/sooktin/prod/
  datasource:
    url: ${/sooktin/prod/db/url}
    username: ${/sooktin/prod/db/username}
    password: ${/sooktin/prod/db/password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:  # Connection Pool 설정 추가
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 update 대신 validate 권장
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false  # 프로덕션에서는 SQL 포매팅 비활성화
    show-sql: false  # 프로덕션에서는 SQL 로깅 비활성화
  security:
    user:
      name: ${/sooktin/prod/security/user/name}
      password: ${/sooktin/prod/security/user/password}
      roles: ADMIN
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${/sooktin/prod/smtp/username}
    password: ${/sooktin/prod/smtp/password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          timeout: 5000  # 타임아웃 설정 추가
          connectiontimeout: 5000
  data:
    redis:
      host: redis
      port: 6379
      timeout: 5000  # Redis 타임아웃 설정 추가

management:
  endpoints:
    web:
      exposure:
        include: prometheus, metrics, health
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized  # 프로덕션에서는 인증된 사용자에게만 상세 정보 표시
    metrics:
      enabled: true
  metrics:
    enable:
      all: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO  # 기본 로그 레벨을 INFO로 설정
    org.springframework.security: INFO  # 프로덕션에서는 DEBUG 대신 INFO 사용
    com.amazonaws: DEBUG
    io.awspring.cloud: DEBUG
    org.springframework.cloud.aws: DEBUG
  file:  # 파일 로깅 추가
    name: /var/log/sooktin/application.log
    max-size: 10MB
    max-history: 30