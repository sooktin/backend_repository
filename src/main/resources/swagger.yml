components:
  schemas:
    CreateUsernoteRequest:
      type: object
      properties:
        content:
          type: string
    CreateUsernoteResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userNickname:
          type: string
        content:
          type: string
        createdAt:
          type: string
        modifiedAt:
          type: string
    ResponseDtoCreateUsernoteResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        message:
          type: string
        data:
          "$ref": "#/components/schemas/CreateUsernoteResponse"
    LikedDto:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        liked:
          type: boolean
    LikedResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        message:
          type: string
        data:
          "$ref": "#/components/schemas/LikedDto"
    CreateCommentRequest:
      type: object
      properties:
        content:
          type: string
    CreateCommentResponse:
      type: object
      properties:
        commentId:
          type: integer
          format: int64
        nickname:
          type: string
        usernoteId:
          type: integer
          format: int64
        content:
          type: string
        isParent:
          type: boolean
        parentId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    ResponseDtoCreateCommentResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        message:
          type: string
        data:
          "$ref": "#/components/schemas/CreateCommentResponse"
    ResponseDtoString:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: string
    CreateCareerCardRequest:
      required:
        - grade
      type: object
      properties:
        major:
          type: string
        studentStatus:
          type: string
        grade:
          type: string
          format: byte
        studentNum:
          type: string
        department:
          maxLength: 30
          minLength: 0
          type: string
        job:
          maxLength: 30
          minLength: 0
          type: string
        experiences:
          type: array
          items:
            "$ref": "#/components/schemas/ExperienceRequest"
        skills:
          type: array
          items:
            maxLength: 100
            minLength: 0
            type: string
        imageUrls:
          maxItems: 3
          minItems: 0
          type: array
          items:
            type: string
    ExperienceRequest:
      required:
        - company
        - period
      type: object
      properties:
        company:
          maxLength: 50
          minLength: 0
          type: string
        period:
          maxLength: 20
          minLength: 0
          type: string
    CreateCareerCardResponse:
      type: object
      properties:
        cardId:
          type: integer
          format: int64
        nickname:
          type: string
        major:
          type: string
        studentNum:
          type: string
        studentStatus:
          type: string
        grade:
          type: integer
          format: int32
        job:
          type: string
        department:
          type: string
        experiences:
          type: array
          items:
            "$ref": "#/components/schemas/Experience"
        skills:
          type: array
          items:
            type: string
        imageUrls:
          type: array
          items:
            type: string
        createdAt:
          type: string
        modifiedAt:
          type: string
    Experience:
      type: object
      properties:
        company:
          type: string
        period:
          type: string
