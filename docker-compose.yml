services:
  app:
    build: .
    # network_mode: "host" 대신
    networks:
      - app-network
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - AWS_DEFAULT_REGION=ap-northeast-2
      - SPRING_DATA_REDIS_HOST=redis
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      - redis

  redis:
    image: redis:latest
    # network_mode: "host" 대신
    networks:
      - app-network

  nginx:
    image: nginx:latest
    # network_mode: host 대신
    networks:
      - app-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

networks:
  app-network:
    driver: bridge