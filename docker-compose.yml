services:
  app:
    build: .
    network_mode: "host"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - AWS_DEFAULT_REGION=ap-northeast-2
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      - redis

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  grafana_data:
networks:
  monitoring:
    driver: bridge