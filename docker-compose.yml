services:
  app:
    build: .
    #network_mode: "host" #Redis와 연결해야 하는 app 컨테이너만 host 모드로 쓰기
    networks:
      - app-network
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - AWS_DEFAULT_REGION=ap-northeast-2
    volumes:
      - ~/.aws:/root/.aws:ro


  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - app-network
    ports:
      - "61613:61613"
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_ENABLED_PLUGINS="rabbitmq_stomp, rabbitmq_management"

  nginx:
    image: nginx:latest
    # network_mode: host 대신
    networks:
      - app-network
    #network_mode: "host"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

networks:
  app-network:
    driver: bridge